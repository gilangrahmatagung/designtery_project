name: Build & Deploy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install & build frontend
        run: |
          npm install
          npm run build

      - name: Package build artifact ke branch deploy
        run: |
          rm -rf node_modules

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Simpan hasil build ke folder sementara
          mkdir -p /tmp/build-output
          cp -r . /tmp/build-output/
          rm -rf /tmp/build-output/.git

          # Checkout branch deploy (buat kalau belum ada)
          git fetch origin deploy || true
          git checkout deploy 2>/dev/null || git checkout -b deploy

          # Ganti isi branch deploy dengan hasil build terbaru
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/build-output/. .

          git add -A
          git commit -m "Build $(date -u +%Y%m%d%H%M%S)" || echo "Tidak ada perubahan untuk di-commit"
          git push origin deploy
