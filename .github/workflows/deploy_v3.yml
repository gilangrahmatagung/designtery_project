name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        run: |
          npm install
          npm run build

      - name: Package build artifact ke branch deploy
        run: |
          rm -rf node_modules

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/build-output
          cp -r . /tmp/build-output/
          rm -rf /tmp/build-output/.git /tmp/build-output/.github

          git fetch origin deploy || true
          git checkout deploy 2>/dev/null || git checkout --orphan deploy

          for i in 1 2 3 4 5; do
            git fetch origin deploy || true
            git reset --hard origin/deploy 2>/dev/null || true

            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -r /tmp/build-output/. .

            git add -A -f .
            git commit -m "Build $(date -u +%Y%m%d%H%M%S)" || echo "Tidak ada perubahan"

            if git push origin deploy; then
              echo "Push berhasil"
              break
            fi
            echo "Push ditolak, coba lagi... (percobaan $i)"
            sleep 5
          done
