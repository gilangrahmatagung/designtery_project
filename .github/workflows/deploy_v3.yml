name: Build & Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --no-dev --optimize-autoloader --prefer-dist

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & build frontend
        run: |
          npm install
          npm run build

      - name: Package build artifact ke branch deploy
        run: |
          rm -rf node_modules

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          mkdir -p /tmp/build-output
          cp -r . /tmp/build-output/
          rm -rf /tmp/build-output/.git /tmp/build-output/.github

          for i in 1 2 3 4 5; do
            git fetch origin deploy || true
            # Bersihkan working tree sebelum checkout agar package-lock.json tidak block
            git reset --hard HEAD || true
            git clean -fdx || true

            if git show-ref --verify --quiet refs/remotes/origin/deploy; then
              git checkout -B deploy origin/deploy
              git reset --hard origin/deploy
            else
              git checkout --orphan deploy
              git reset --hard || true
            fi

            git clean -fdx || true
            find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
            cp -r /tmp/build-output/. .
            rm -rf node_modules

            git add -A -f .
            if ! git commit -m "Build $(date -u +%Y%m%d%H%M%S)"; then
              echo "Tidak ada perubahan untuk di-commit"
              exit 0
            fi

            if git push origin deploy; then
              echo "Push berhasil (percobaan $i)"
              break
            fi

            echo "Push ditolak, coba lagi... (percobaan $i)"
            sleep 5

            if [ "$i" -eq 5 ]; then
              echo "Gagal push setelah 5 percobaan"
              exit 1
            fi
          done
