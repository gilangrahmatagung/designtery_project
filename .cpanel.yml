---
deployment:
  tasks:
    - /bin/echo "=== DEPLOY DEBUG ===" > /home/desa7677/deploy-debug.log
    - /bin/date >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/echo "--- which rsync ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /usr/bin/which rsync >> /home/desa7677/deploy-debug.log 2>&1 || /bin/echo "rsync NOT FOUND" >> /home/desa7677/deploy-debug.log
    - /bin/echo "--- ls repositories ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/ls -la /home/desa7677/repositories/ >> /home/desa7677/deploy-debug.log 2>&1 || /bin/echo "repositories dir NOT FOUND" >> /home/desa7677/deploy-debug.log
    - /bin/echo "--- ls repositories/laravel-app (top) ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/ls -la /home/desa7677/repositories/laravel-app/ >> /home/desa7677/deploy-debug.log 2>&1 || /bin/echo "laravel-app repo NOT FOUND" >> /home/desa7677/deploy-debug.log
    - /bin/echo "--- ls laravel-app target dir ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/ls -la /home/desa7677/laravel-app/ >> /home/desa7677/deploy-debug.log 2>&1 || /bin/echo "laravel-app target NOT FOUND" >> /home/desa7677/deploy-debug.log
    - /bin/echo "--- try rsync verbose ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /usr/bin/rsync -av --delete --exclude='.env' --exclude='storage/logs' --exclude='storage/app' /home/desa7677/repositories/laravel-app/ /home/desa7677/laravel-app/ >> /home/desa7677/deploy-debug.log 2>&1 || /bin/echo "RSYNC FAILED with exit code $?" >> /home/desa7677/deploy-debug.log
    - /bin/echo "--- ls laravel-app AFTER rsync ---" >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/ls -la /home/desa7677/laravel-app/ >> /home/desa7677/deploy-debug.log 2>&1
    - /bin/echo "=== END DEBUG ===" >> /home/desa7677/deploy-debug.log 2>&1
